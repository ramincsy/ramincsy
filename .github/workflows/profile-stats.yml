name: Update profile stats cards

# Regenerates the SVG cards embedded in README.md and commits them to
# profile-stats/. The public github-readme-stats.vercel.app instance is paused,
# so these files are the source of truth.
#
# First run: Actions → "Update profile stats cards" → Run workflow.
# The daily schedule starts only after this file is on the default branch.
#
# Permissions: this workflow sets contents: write. The repository setting must
# allow it too: Settings → Actions → General → Workflow permissions →
# "Read and write permissions". The default branch also has to accept pushes
# from GitHub Actions.
#
# Optional secret STATS_TOKEN: a classic PAT with the `repo` scope (and
# `read:user` if you want private contribution totals). When it is set, the
# stats cards include private repositories (count_private) and pin cards can
# read private repos. When it is unset, the workflow uses GITHUB_TOKEN and
# public data only.
#
# The stats query counts every commit and pull request. For this account that
# query is large enough that api.github.com often answers with an nginx 502 or
# a 504 HTML page instead of GraphQL JSON. github-readme-stats-core then
# crashes with "Cannot read properties of undefined (reading 'user')". Cards
# are generated one at a time, and the stats card is retried after a pause.

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-stats
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      # One card at a time. Parallel stats queries are what provoked the 502s.
      max-parallel: 1
      matrix:
        include:
          - name: stats-light
            card: stats
            optional: "false"
            attempts: "4"
            count_private: true
            options: "username=ramincsy&show_icons=true&theme=transparent&hide_border=true&disable_animations=true"
            path: profile-stats/stats-light.svg
          - name: stats-dark
            card: stats
            optional: "false"
            attempts: "4"
            count_private: true
            options: "username=ramincsy&show_icons=true&theme=github_dark&bg_color=00000000&border_color=00000000&hide_border=true&disable_animations=true"
            path: profile-stats/stats-dark.svg
          - name: top-langs-light
            card: top-langs
            optional: "false"
            attempts: "2"
            count_private: false
            options: "username=ramincsy&langs_count=6&layout=compact&theme=transparent&hide_border=true&disable_animations=true"
            path: profile-stats/top-langs-light.svg
          - name: top-langs-dark
            card: top-langs
            optional: "false"
            attempts: "2"
            count_private: false
            options: "username=ramincsy&langs_count=6&layout=compact&theme=github_dark&bg_color=00000000&border_color=00000000&hide_border=true&disable_animations=true"
            path: profile-stats/top-langs-dark.svg
          - name: pin-best-coin-address-validator-light
            card: pin
            optional: "false"
            attempts: "2"
            count_private: false
            options: "username=ramincsy&repo=Best-Coin-Address-Validator-&theme=transparent&hide_border=true&disable_animations=true"
            path: profile-stats/pin-best-coin-address-validator-light.svg
          - name: pin-best-coin-address-validator-dark
            card: pin
            optional: "false"
            attempts: "2"
            count_private: false
            options: "username=ramincsy&repo=Best-Coin-Address-Validator-&theme=github_dark&bg_color=00000000&border_color=00000000&hide_border=true&disable_animations=true"
            path: profile-stats/pin-best-coin-address-validator-dark.svg
          - name: pin-gthub-achievements-light
            card: pin
            optional: "false"
            attempts: "2"
            count_private: false
            options: "username=ramincsy&repo=Gthub-Achievements&theme=transparent&hide_border=true&disable_animations=true"
            path: profile-stats/pin-gthub-achievements-light.svg
          - name: pin-gthub-achievements-dark
            card: pin
            optional: "false"
            attempts: "2"
            count_private: false
            options: "username=ramincsy&repo=Gthub-Achievements&theme=github_dark&bg_color=00000000&border_color=00000000&hide_border=true&disable_animations=true"
            path: profile-stats/pin-gthub-achievements-dark.svg

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate card
        uses: ./.github/actions/generate-card
        with:
          card: ${{ matrix.card }}
          # count_private is appended only for the stats cards, and only when
          # STATS_TOKEN is configured. GITHUB_TOKEN cannot see private repos.
          options: ${{ matrix.options }}${{ matrix.count_private && secrets.STATS_TOKEN != '' && '&count_private=true' || '' }}
          path: ${{ matrix.path }}
          token: ${{ secrets.STATS_TOKEN || secrets.GITHUB_TOKEN }}
          attempts: ${{ matrix.attempts }}
          optional: ${{ matrix.optional }}

      - name: Upload card
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: card-${{ matrix.name }}
          path: ${{ matrix.path }}
          if-no-files-found: ignore
          retention-days: 1

  commit:
    needs: generate
    if: always() && needs.generate.result != 'cancelled'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download cards
        id: download
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: card-*
          path: downloaded-cards
          merge-multiple: true

      - name: Commit cards
        if: steps.download.outcome == 'success'
        run: |
          mkdir -p profile-stats
          find downloaded-cards -name '*.svg' -exec cp -f {} profile-stats/ \;
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile-stats
          if git diff --staged --quiet; then
            echo "No card changes."
            exit 0
          fi
          git commit -m "Update profile stats cards"
          git push
