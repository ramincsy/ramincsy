          width="15.94"
          height="8"
          fill="#89e051"
        />
      
        <rect
          mask="url(#rect-mask)"
          data-testid="lang-progress"
          x="243.98"
          y="0"
          width="14.35"
          height="8"
          fill="#7355dd"
        />
      
        <rect
